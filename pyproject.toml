[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resto-pilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "antiword>=0.5",
    "celery[sqs]>=5.6.0",
    "docx2txt>=0.8",
    "fastapi[standard]>=0.124.0",
    "mangum>=0.19.0",
    "openpyxl>=3.1.2",
    "pandas>=2.0.0",
    "pdf2image>=1.17.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-docx>=1.1.0",
    "pypdf>=5.1.0",
    "redis>=7.1.0",
    "sqlalchemy>=2.0.45",
    "uvicorn[standard]>=0.38.0",
    "xlrd>=2.0.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]
